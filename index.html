<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dzn Buzzard ✨ Catálogo</title>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap');
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
    body { background: linear-gradient(180deg, #f8f9ff 0%, #e6e9ff 100%); color: #333; }
    header { background: linear-gradient(135deg, #1a237e 0%, #5c6bc0 50%, #ce93d8 100%); color: white; padding: 50px 20px; text-align: center; border-bottom: 4px solid #ffd1dc; }
    header .logo { font-size: 3em; font-weight: 800; letter-spacing: 2px; }
    header .slogan { font-size: 1.1em; opacity: 0.95; font-weight: 300; }
    .container { max-width: 900px; margin: 30px auto; padding: 0 20px; }
    .section { background: white; border-radius: 20px; padding: 28px; margin-bottom: 25px; box-shadow: 0 8px 25px rgba(92,107,192,0.15); border-left: 6px solid #5c6bc0; }
    .section h2 { color: #1a237e; margin-bottom: 18px; font-weight: 700; }
    .item { display: flex; justify-content: space-between; padding: 14px 0; border-bottom: 1px dashed #d1c4e9; }
    .item-price { color: #7b1fa2; font-weight: 700; white-space: pre-line; text-align: right; }
    .payment-method { background: linear-gradient(135deg, #e8eaf6 0%, #f3e5f5 100%); padding: 18px; border-radius: 15px; margin-bottom: 15px; border-left: 5px solid #5c6bc0; }
    .copy-btn { background: linear-gradient(135deg, #5c6bc0 0%, #7b1fa2 100%); color: white; border: none; padding: 6px 14px; border-radius: 20px; cursor: pointer; font-size: 0.8em; margin-left: 10px; }
    .whatsapp-btn { display: block; background: linear-gradient(135deg, #25D366 0%, #128C7E 100%); color: white; text-align: center; padding: 18px; border-radius: 50px; text-decoration: none; font-weight: 800; font-size: 1.15em; margin-top: 25px; }
    footer { text-align: center; padding: 25px; color: #5c6bc0; }
</style>
</head>
<body>

<header>
    <div class="logo">DZN BUZZARD</div>
    <p class="slogan">✨ Diseños que vuelan alto ✨</p>
</header>

<div class="container">
    <div class="section">
        <h2>💅 CALIGRÁFICOS</h2>
        <div class="item"><span>Simple 100 diamantes</span><span class="item-price">35mxn</span></div>
        <div class="item"><span>Curvo 200 diamantes</span><span class="item-price">45mxn</span></div>
    </div>

    <div class="section">
        <h2>💳 MÉTODOS DE PAGO</h2>
        <div class="payment-method">
            <h3>🇲🇽 TRANSFERENCIA MXN</h3>
            <p><b>CLABE:</b> 722969020738386592 <button class="copy-btn" onclick="copy('722969020738386592')">Copiar</button></p>
        </div>
    </div>

    <a href="https://wa.me/525578713495" target="_blank" class="whatsapp-btn">💬 Pedir por WhatsApp</a>
</div>

<footer>© 2026 Dzn Buzzard</footer>

<script>
function copy(text) {
    navigator.clipboard.writeText(text);
    alert('✅ Copiado: ' + text);
}
</script>
</body>
</html>
